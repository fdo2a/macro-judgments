# 손으로 돌리는 것 — FRED 키(저장소 비밀값 FRED_API_KEY)가 필요하다.
#  schedule: 앞으로의 CPI·고용 예정일을 rules/schedule.json 에 덧붙인다(지우지 않는다).
#  base_rate: 규칙 v1 고정 전에 기후값을 한 번 계산한다. 한 달에 발표일이 둘 잡히면 실패로 끝나고 목록을 보여 준다
#             — BLS 공지와 대조해 drop 에 적고 다시 돌린다.
name: rules-from-fred
on:
  workflow_dispatch:
    inputs:
      job:
        description: schedule | base_rate
        required: true
        default: schedule
      until:
        description: schedule 의 끝 날짜
        default: '2027-12-31'
      end:
        description: base_rate 의 끝(이 날짜 전까지, 규칙 고정일)
        default: ''
      drop:
        description: base_rate 에서 뺄 날짜(공백으로 구분)
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      UNTIL: ${{ inputs.until }}
      END: ${{ inputs.end }}
      DROP: ${{ inputs.drop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: schedule
        if: inputs.job == 'schedule'
        run: python scripts/build_schedule.py --until "$UNTIL"
      - name: base_rate
        if: inputs.job == 'base_rate'
        run: |
          if [ -n "$DROP" ]; then python scripts/base_rate.py --end "$END" --out rules/v1-base-rate.json --drop $DROP
          else python scripts/base_rate.py --end "$END" --out rules/v1-base-rate.json; fi
      - name: commit
        run: |
          git config user.name 'macro-judgments-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/
          git diff --cached --quiet && exit 0
          git commit -q -m "rules: FRED 로 갱신"
          git pull -q --rebase origin main && git push -q origin HEAD:main
